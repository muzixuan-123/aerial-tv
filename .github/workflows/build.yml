name: build-aerial

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;35.0.0"

      - name: Build guard release APK
        run: ./gradlew assembleGuardRelease --console=plain --stacktrace 2>&1 | tee build-log.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerial-guard-release
          path: app/build/outputs/apk/guard/release/*.apk
          if-no-files-found: error

      - name: Publish release with APK and log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aerial custom build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/guard/release/*.apk
            build-log.txt
